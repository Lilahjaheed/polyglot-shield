<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Signup Bot Dashboard</title>
<style>
:root {
  --bg: #0f172a; --card: #1e293b; --border: #334155;
  --text: #e2e8f0; --muted: #94a3b8;
  --green: #22c55e; --green-d: #16a34a;
  --red: #ef4444; --red-d: #dc2626;
  --blue: #3b82f6; --blue-d: #2563eb;
  --yellow: #eab308;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh; padding: 16px;
  max-width: 480px; margin: 0 auto;
}
h1 { font-size: 20px; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.conn { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); display: inline-block; }
.conn.on { background: var(--green); box-shadow: 0 0 6px var(--green); }
.conn.off { background: var(--red); }
.sub { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px; margin-bottom: 12px;
}
.stats { display: flex; gap: 12px; flex-wrap: wrap; }
.stat { flex: 1; min-width: 90px; text-align: center; }
.stat .num { font-size: 22px; font-weight: 700; }
.stat .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
button {
  border: none; border-radius: 10px; padding: 12px 8px;
  font-size: 14px; font-weight: 600; cursor: pointer; color: #fff;
  transition: transform .1s, opacity .15s; width: 100%;
}
button:active { transform: scale(.96); }
button:disabled { opacity: .4; cursor: not-allowed; }
.btn-green { background: var(--green); } .btn-green:active { background: var(--green-d); }
.btn-red { background: var(--red); } .btn-red:active { background: var(--red-d); }
.btn-blue { background: var(--blue); } .btn-blue:active { background: var(--blue-d); }
.btn-dark { background: var(--border); }
.progress-wrap { background: #0b1220; border-radius: 8px; height: 14px; overflow: hidden; margin: 10px 0; }
.progress-bar { background: linear-gradient(90deg, var(--blue), var(--green)); height: 100%; width: 0%; transition: width .4s; }
.log { font-size: 12px; max-height: 160px; overflow-y: auto; font-family: monospace; }
.log div { padding: 2px 0; border-bottom: 1px solid #222; word-break: break-all; }
.ok { color: var(--green); } .err { color: var(--red); }
label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; margin-top: 10px; }
input[type=text], select {
  width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  background: #0b1220; color: var(--text); font-size: 14px;
}
input[type=text]:focus, select:focus { outline: none; border-color: var(--blue); }
.switch { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.switch label { margin: 0; font-size: 14px; color: var(--text); }
.toggle { position: relative; width: 52px; height: 28px; }
.toggle input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0; background: #64748b; border-radius: 28px;
  cursor: pointer; transition: .3s;
}
.slider:before {
  content: ""; position: absolute; height: 22px; width: 22px; left: 3px; bottom: 3px;
  background: #fff; border-radius: 50%; transition: .3s;
}
.toggle input:checked + .slider { background: var(--green); }
.toggle input:checked + .slider:before { transform: translateX(24px); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; }
.badge-on { background: rgba(34,197,94,.2); color: var(--green); }
.badge-off { background: rgba(239,68,68,.2); color: var(--red); }
.accounts { max-height: 220px; overflow-y: auto; font-size: 12px; }
.accounts .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); gap: 8px; }
.accounts .row span:last-child { color: var(--muted); word-break: break-all; text-align: right; }
.muted { color: var(--muted); }
.toast {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--card); border: 1px solid var(--border); padding: 10px 18px;
  border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none;
  z-index: 99; max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; }
.save-row { display: flex; gap: 8px; margin-top: 10px; }
.save-row button { flex: 1; }
.hint { font-size: 11px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
<h1>🤖 Signup Bot <span class="conn" id="connDot"></span></h1>
<div class="sub">v<span id="ver">…</span> · <span id="engine">…</span></div>

<div class="card">
  <div class="stats">
    <div class="stat"><div class="num" id="totalAcc">0</div><div class="lbl">Accounts</div></div>
    <div class="stat"><div class="num" id="doneN">0</div><div class="lbl">Done</div></div>
    <div class="stat"><div class="num ok" id="okN">0</div><div class="lbl">Created</div></div>
    <div class="stat"><div class="num err" id="failN">0</div><div class="lbl">Failed</div></div>
  </div>
  <div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
  <div class="log" id="log"><div class="muted">No activity yet.</div></div>
</div>

<div class="card">
  <div class="grid3">
    <button class="btn-green" onclick="start(1)">+1</button>
    <button class="btn-green" onclick="start(5)">+5</button>
    <button class="btn-green" onclick="start(10)">+10</button>
  </div>
  <div class="grid" style="margin-top:8px">
    <button class="btn-green" onclick="start(20)">+20</button>
    <button class="btn-green" onclick="start(50)">+50</button>
  </div>
  <button class="btn-red" id="stopBtn" style="margin-top:8px" disabled onclick="stopJob()">🛑 Stop</button>
</div>

<div class="card">
  <b>⚙️ Settings</b>
  <div class="switch">
    <label>Auto-OTP <span id="otpBadge" class="badge badge-off">…</span></label>
    <div class="toggle">
      <input type="checkbox" id="otpToggle">
      <span class="slider" onclick="toggleOtp()"></span>
    </div>
  </div>
  <div class="hint">ON = temp email + auto code reading. OFF = your email, you send codes.</div>

  <label>Region</label>
  <select id="regionSel">
    <option value="nigeria">🇳🇬 Nigeria</option>
    <option value="usa">🇺🇸 USA</option>
    <option value="uk">🇬🇧 UK</option>
    <option value="ghana">🇬🇭 Ghana</option>
    <option value="kenya">🇰🇪 Kenya</option>
    <option value="south_africa">🇿🇦 South Africa</option>
    <option value="canada">🇨🇦 Canada</option>
    <option value="india">🇮🇳 India</option>
    <option value="uae">🇦🇪 UAE</option>
    <option value="germany">🇩🇪 Germany</option>
  </select>
  <div class="save-row">
    <button class="btn-blue" onclick="saveRegion()">💾 Save Region</button>
  </div>

  <label>Website URL</label>
  <input type="text" id="siteUrl" placeholder="https://..." spellcheck="false">
  <div class="save-row">
    <button class="btn-blue" onclick="saveUrl()">💾 Save URL</button>
  </div>
</div>

<div class="card">
  <b>📋 Accounts</b>
  <div class="accounts" id="accounts"><div class="muted">Loading…</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
const T = new URLSearchParams(location.search).get('t') || '';
let serverState = { auto_otp: false, region: 'nigeria', url: '' };
// Local-edit lock: while user is typing/toggling, server polls must NOT overwrite
let lockUntil = 0;
let saving = false;

function lock() { lockUntil = Date.now() + 15000; }
function locked() { return Date.now() < lockUntil || saving; }

function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), ms || 2500);
}

async function api(path, opts={}) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch('/api/'+path+sep+'t='+encodeURIComponent(T), opts);
  if (r.status === 401) {
    setConn(false);
    throw new Error('Unauthorized — open the app from the bot button');
  }
  setConn(true);
  return r;
}

function setConn(on) {
  const d = document.getElementById('connDot');
  d.className = 'conn ' + (on ? 'on' : 'off');
}

// ---------- OTP toggle (manual, not overwritten by polls) ----------
async function toggleOtp() {
  const el = document.getElementById('otpToggle');
  el.checked = !el.checked; // slider click fires even when we change via JS; flip it
  const v = el.checked;
  lock(); saving = true;
  try {
    const r = await api('settings', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({auto_otp: v})
    });
    const d = await r.json();
    serverState.auto_otp = d.auto_otp;
    updateOtpUi(d.auto_otp);
    toast(v ? '🟢 Auto-OTP ON' : '🔴 Auto-OTP OFF');
  } catch(e) {
    el.checked = !v; // revert
    toast('❌ ' + e.message, 4000);
  } finally {
    saving = false;
  }
}

function updateOtpUi(v) {
  document.getElementById('otpToggle').checked = !!v;
  const b = document.getElementById('otpBadge');
  b.textContent = v ? 'ON' : 'OFF';
  b.className = 'badge ' + (v ? 'badge-on' : 'badge-off');
}

// ---------- URL (only server-fills when field is NOT focused/edited) ----------
const urlInput = document.getElementById('siteUrl');
urlInput.addEventListener('focus', lock);
urlInput.addEventListener('input', lock);

async function saveUrl() {
  const v = urlInput.value.trim();
  if (!v) return toast('Enter a URL first');
  if (!/^https?:\/\//i.test(v)) return toast('URL must start with http:// or https://');
  saving = true;
  try {
    const r = await api('settings', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({url: v})
    });
    const d = await r.json();
    serverState.url = d.url;
    toast('💾 URL saved: ' + d.url, 3500);
  } catch(e) {
    toast('❌ Save failed: ' + e.message, 4500);
  } finally {
    saving = false;
    lockUntil = Date.now() + 3000; // brief extra lock so poll doesn't flicker
  }
}

// ---------- Region (explicit save button, no silent overwrite while focused) ----------
const regionSel = document.getElementById('regionSel');
regionSel.addEventListener('focus', lock);

async function saveRegion() {
  const v = regionSel.value;
  saving = true;
  try {
    const r = await api('settings', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({region: v})
    });
    const d = await r.json();
    serverState.region = d.region;
    toast('🌍 Region saved');
  } catch(e) {
    toast('❌ ' + e.message, 4000);
  } finally {
    saving = false;
  }
}

// ---------- Jobs ----------
async function start(n) {
  try {
    const r = await api('start', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({count:n})
    });
    const d = await r.json();
    toast(d.message || 'Started');
    pollStatus(); pollAccounts();
  } catch(e) {
    toast('❌ ' + e.message, 4000);
  }
}
async function stopJob() {
  try {
    await api('stop', {method:'POST'});
    toast('🛑 Stop requested');
  } catch(e) { toast('❌ ' + e.message, 4000); }
}

function esc(s){ return String(s).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }

let lastJobActive = false;

async function pollStatus() {
  if (document.hidden) return; // save data when tab is in background
  try {
    const r = await api('status');
    const d = await r.json();
    document.getElementById('ver').textContent = d.version;
    document.getElementById('engine').textContent = d.engine;
    document.getElementById('totalAcc').textContent = d.total_accounts;
    document.getElementById('doneN').textContent = d.job?.done ?? 0;
    document.getElementById('okN').textContent = d.job?.created?.length ?? 0;
    document.getElementById('failN').textContent = d.job?.failed ?? 0;
    const total = d.job?.total || 0, done = d.job?.done || 0;
    document.getElementById('pbar').style.width = total ? (done/total*100)+'%' : '0%';
    const active = !!d.job?.active;
    document.querySelectorAll('.grid3 .btn-green, .grid .btn-green').forEach(b => b.disabled = active);
    document.getElementById('stopBtn').disabled = !active;
    if (active || lastJobActive) {
      const log = document.getElementById('log');
      let html = '';
      (d.job.created||[]).slice(-6).forEach(e => html += '<div class="ok">✅ '+esc(e)+'</div>');
      (d.job.errors||[]).slice(-6).forEach(e => html += '<div class="err">❌ '+esc(e)+'</div>');
      if (!html) html = '<div class="muted">Working…</div>';
      log.innerHTML = html;
      log.scrollTop = log.scrollHeight;
      if (active && !lastJobActive) pollAccounts(); // refresh list when job just finished
    }
    lastJobActive = active;
    // Only push server settings into the form when user is NOT editing
    if (!locked()) {
      serverState = {auto_otp: d.auto_otp, region: d.region, url: d.url};
      updateOtpUi(d.auto_otp);
      regionSel.value = d.region;
      if (document.activeElement !== urlInput) urlInput.value = d.url;
    }
  } catch(e) {
    setConn(false);
  }
}

async function pollAccounts() {
  if (document.hidden) return;
  try {
    const r = await api('accounts');
    const d = await r.json();
    const el = document.getElementById('accounts');
    const keys = Object.keys(d.accounts||{});
    if (!keys.length) { el.innerHTML = '<div class="muted">No accounts yet.</div>'; return; }
    el.innerHTML = keys.slice().reverse().map(k => {
      const a = d.accounts[k];
      return '<div class="row"><span>'+esc(a.full_name||'')+'</span><span>'+esc(k)+'</span></div>';
    }).join('');
  } catch(e) {}
}

// Faster polls while a job is running, slow when idle
setInterval(pollStatus, 2500);
setInterval(pollAccounts, 10000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { pollStatus(); pollAccounts(); } });

pollStatus(); pollAccounts();
</script>
</body>
</html>
